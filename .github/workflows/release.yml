name: Release to GitHub Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (e.g. 1.0.2 - leave empty for auto 1.0.X)'
        required: false
        default: ''
      version_code:
        description: 'Version Code (Integer, e.g. 12 - leave blank for auto increment)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build_release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Required Repository Secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "Checking required repository secrets for release..."
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Required secret 'RELEASE_KEYSTORE_BASE64' is missing in GitHub Repository Secrets!"
            echo "Build cannot proceed. Keystore secret must be configured in repository secrets."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Required secret 'KEYSTORE_PASSWORD' is missing in GitHub Repository Secrets!"
            echo "Build cannot proceed. KEYSTORE_PASSWORD must be configured in repository secrets."
            exit 1
          fi
          echo "✅ All required repository secrets are present."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate or Recreate Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || ! jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "⚠️ Gradle wrapper jar is missing or corrupted. Downloading fresh wrapper jar..."
            rm -f gradle/wrapper/gradle-wrapper.jar
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar || \
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v9.3.1/gradle/wrapper/gradle-wrapper.jar
            echo "Fresh gradle-wrapper.jar restored."
          else
            echo "✅ Gradle wrapper jar is valid."
          fi
          chmod +x ./gradlew

      - name: Setup Environment File
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Determine Version Code and Name
        id: versioning
        run: |
          if [ -n "${{ inputs.version_code }}" ]; then
            V_CODE="${{ inputs.version_code }}"
          else
            # Uses github.run_number directly so each build automatically increments (1, 2, 3...)
            V_CODE="${{ github.run_number }}"
          fi

          if [ -n "${{ inputs.version }}" ]; then
            V_NAME="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V_NAME="${GITHUB_REF_NAME#v}"
          else
            V_NAME="1.0.${V_CODE}"
          fi

          echo "Determined Version Code: $V_CODE"
          echo "Determined Version Name: $V_NAME"
          echo "v_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "v_name=$V_NAME" >> $GITHUB_OUTPUT

      - name: Ensure Debug Keystore Exists
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -alias androiddebugkey
          fi

      - name: Build Release APK, Debug APK and AAB
        run: |
          ./gradlew assembleRelease assembleDebug bundleRelease \
            -PversionCode=${{ steps.versioning.outputs.v_code }} \
            -PversionName=${{ steps.versioning.outputs.v_name }} \
            --no-daemon

      - name: Sign Release APK & AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || '' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          V_NAME: ${{ steps.versioning.outputs.v_name }}
        run: |
          mkdir -p release_out
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          AAB=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" release_out/GothwadTVBrowser-v${V_NAME}-Debug.apk
            echo "Copied Debug APK: release_out/GothwadTVBrowser-v${V_NAME}-Debug.apk"
          fi

          # Fail if keystore secret is missing (strictly enforced)
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing! Aborting build."
            exit 1
          fi

          # Store keystore in secure temporary location outside release outputs
          KS_PATH="/tmp/release_key.jks"
          
          echo "Using Permanent Keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KS_PATH"
          if ! keytool -list -keystore "$KS_PATH" -storepass "$KEYSTORE_PASS" > /tmp/kt_diag.log 2>&1; then
            echo "::error::keytool failed to verify keystore with provided password!"
            cat /tmp/kt_diag.log
            exit 1
          fi

          # Dynamically detect exact Alias name from the keystore
          DETECTED_ALIAS=$(keytool -list -v -keystore "$KS_PATH" -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | sed 's/.*Alias name: //I' | tr -d '\r' | xargs)
          
          if [ -n "$KEY_ALIAS" ]; then
            ACTUAL_ALIAS="$KEY_ALIAS"
          elif [ -n "$DETECTED_ALIAS" ]; then
            ACTUAL_ALIAS="$DETECTED_ALIAS"
          else
            echo "::error::Could not determine keystore alias name!"
            exit 1
          fi
          
          echo "Using Keystore Alias: $ACTUAL_ALIAS"

          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APK" ]; then
            $APKSIGNER sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$ACTUAL_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out release_out/GothwadTVBrowser-v${V_NAME}-Release.apk \
              "$APK"
              
            $APKSIGNER verify --verbose release_out/GothwadTVBrowser-v${V_NAME}-Release.apk
          fi

          if [ -n "$AAB" ]; then
            cp "$AAB" release_out/GothwadTVBrowser-v${V_NAME}-PlayStore.aab
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KS_PATH" \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \
              release_out/GothwadTVBrowser-v${V_NAME}-PlayStore.aab \
              "$ACTUAL_ALIAS"
            echo "Successfully signed Play Store AAB!"
          fi

          # Securely destroy the temporary keystore file so it is never exposed or uploaded
          rm -f "$KS_PATH"
          echo "Keystore securely cleaned up."

      - name: Build Linux Packages (.deb & .tar.gz)
        run: |
          if [ -f packaging/linux/build-linux-packages.sh ]; then
            chmod +x packaging/linux/build-linux-packages.sh
            RELEASE_APK="release_out/GothwadTVBrowser-v${{ steps.versioning.outputs.v_name }}-Release.apk"
            if [ ! -f "$RELEASE_APK" ]; then
              RELEASE_APK="release_out/GothwadTVBrowser-v${{ steps.versioning.outputs.v_name }}-Debug.apk"
            fi
            ./packaging/linux/build-linux-packages.sh \
              "$RELEASE_APK" \
              "${{ steps.versioning.outputs.v_name }}" \
              "release_out"
          else
            echo "packaging/linux/build-linux-packages.sh not found, skipping."
          fi

      - name: Build Windows Package (.zip)
        run: |
          if [ -f packaging/windows/build-windows-package.sh ]; then
            chmod +x packaging/windows/build-windows-package.sh
            RELEASE_APK="release_out/GothwadTVBrowser-v${{ steps.versioning.outputs.v_name }}-Release.apk"
            if [ ! -f "$RELEASE_APK" ]; then
              RELEASE_APK="release_out/GothwadTVBrowser-v${{ steps.versioning.outputs.v_name }}-Debug.apk"
            fi
            ./packaging/windows/build-windows-package.sh \
              "$RELEASE_APK" \
              "${{ steps.versioning.outputs.v_name }}" \
              "release_out"
          else
            echo "packaging/windows/build-windows-package.sh not found, skipping."
          fi

      - name: Build macOS Package (.app in .zip)
        run: |
          if [ -f packaging/macos/build-macos-package.sh ]; then
            chmod +x packaging/macos/build-macos-package.sh
            RELEASE_APK="release_out/GothwadTVBrowser-v${{ steps.versioning.outputs.v_name }}-Release.apk"
            if [ ! -f "$RELEASE_APK" ]; then
              RELEASE_APK="release_out/GothwadTVBrowser-v${{ steps.versioning.outputs.v_name }}-Debug.apk"
            fi
            ./packaging/macos/build-macos-package.sh \
              "$RELEASE_APK" \
              "${{ steps.versioning.outputs.v_name }}" \
              "release_out"
          else
            echo "packaging/macos/build-macos-package.sh not found, skipping."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.versioning.outputs.v_name }}
          name: v${{ steps.versioning.outputs.v_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release_out/GothwadTVBrowser-v${{ steps.versioning.outputs.v_name }}-Release.apk
            release_out/GothwadTVBrowser-v${{ steps.versioning.outputs.v_name }}-Debug.apk
            release_out/GothwadTVBrowser-v${{ steps.versioning.outputs.v_name }}-PlayStore.aab
            release_out/gothwad-browser_${{ steps.versioning.outputs.v_name }}_all.deb
            release_out/gothwad-browser-linux-v${{ steps.versioning.outputs.v_name }}.tar.gz
            release_out/gothwad-browser-windows-${{ steps.versioning.outputs.v_name }}.zip
            release_out/gothwad-browser-macos-${{ steps.versioning.outputs.v_name }}.zip
